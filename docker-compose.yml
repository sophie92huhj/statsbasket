services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: statsbasket
      POSTGRES_PASSWORD: statsbasket
      POSTGRES_DB: statsbasket
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: "--auth-host=md5"
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
